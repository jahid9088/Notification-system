<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FUN OWNER Notification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at top,#06382d,#050505 60%);
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .box{
      width:100%;
      max-width:430px;
      background:rgba(10,10,10,.94);
      border:1px solid rgba(0,255,179,.25);
      border-radius:22px;
      padding:22px;
      text-align:center;
      box-shadow:0 0 35px rgba(0,255,179,.18);
    }
    h2{margin:0 0 8px;color:#00ffb3}
    p{color:#bbb;font-size:14px}
    button{
      width:100%;
      padding:14px;
      margin-top:12px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,#00ffb3,#00aaff);
      color:#000;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    textarea{
      width:100%;
      height:135px;
      margin-top:15px;
      background:#050505;
      color:#00ffb3;
      border:1px solid #333;
      border-radius:12px;
      padding:10px;
      resize:none;
      font-size:12px;
    }
    .status{
      margin-top:14px;
      color:#00ffb3;
      font-size:13px;
      word-break:break-word;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>FUN OWNER Notification</h2>
  <p>Notification allow karo. Token Firebase me save hoga.</p>

  <button onclick="startNotification()">Allow Notification</button>
  <button onclick="testNotification()">Test Notification</button>

  <div class="status" id="status">Status: Ready</div>
  <textarea id="tokenBox" readonly placeholder="FCM token yaha show hoga..."></textarea>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCB1gPJXybWGvJR3APcdUp98CMAPSyAVmo",
    authDomain: "funownernullnullprotejet.firebaseapp.com",
    databaseURL: "https://funownernullnullprotejet-default-rtdb.firebaseio.com",
    projectId: "funownernullnullprotejet",
    storageBucket: "funownernullnullprotejet.firebasestorage.app",
    messagingSenderId: "391038052290",
    appId: "1:391038052290:android:fe4c061fdede429644185b"
  };

  const vapidKey = "BHdlfi-Jn1HMSx9763VDwWx793ANAMIRxUh6_FJ63us1KsPoBI93sKjelyDA0ADfBMLS1wXRd-1UT36TOhinHWA";

  firebase.initializeApp(firebaseConfig);

  const messaging = firebase.messaging();
  const db = firebase.database();

  function setStatus(text){
    document.getElementById("status").innerText = "Status: " + text;
  }

  function safeKey(token){
    return token.replace(/[.#$/\[\]]/g, "_");
  }

  async function startNotification(){
    try{
      if(!("Notification" in window)){
        alert("Browser notification support nahi karta.");
        return;
      }

      if(!("serviceWorker" in navigator)){
        alert("Service Worker support nahi hai.");
        return;
      }

      setStatus("Permission asking...");
      const permission = await Notification.requestPermission();

      if(permission !== "granted"){
        setStatus("Permission blocked");
        alert("Notification allow nahi hua.");
        return;
      }

      setStatus("Service Worker registering...");
      const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");

      setStatus("Token generating...");
      const token = await messaging.getToken({
        vapidKey: vapidKey,
        serviceWorkerRegistration: registration
      });

      if(!token){
        setStatus("Token generate nahi hua");
        return;
      }

      document.getElementById("tokenBox").value = token;

      await db.ref("WebPushTokens/" + safeKey(token)).set({
        token: token,
        createdAt: Date.now(),
        lastSeen: Date.now(),
        userAgent: navigator.userAgent,
        url: location.href
      });

      setStatus("Token saved successfully ✅");

    }catch(e){
      console.error(e);
      setStatus("Error: " + e.message);
      alert(e.message);
    }
  }

  messaging.onMessage(function(payload){
    console.log("Foreground message:", payload);

    const title = payload.notification?.title || payload.data?.title || "FUN OWNER";
    const body = payload.notification?.body || payload.data?.body || "New notification";
    const icon = payload.notification?.icon || payload.data?.icon || "";

    new Notification(title, {
      body: body,
      icon: icon
    });
  });

  function testNotification(){
    if(Notification.permission !== "granted"){
      alert("Pehle Allow Notification dabao.");
      return;
    }

    new Notification("FUN OWNER TEST", {
      body: "Bhai local notification working hai!"
    });
  }
</script>

</body>
</html>
