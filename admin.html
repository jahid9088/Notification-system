<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FUN OWNER Push Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at top,#102b24,#050505 60%);
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .box{
      width:100%;
      max-width:460px;
      background:rgba(10,10,10,.94);
      border:1px solid rgba(0,255,179,.25);
      border-radius:22px;
      padding:22px;
      box-shadow:0 0 35px rgba(0,255,179,.18);
    }
    h2{
      margin:0 0 8px;
      text-align:center;
      color:#00ffb3;
    }
    p{
      text-align:center;
      color:#aaa;
      font-size:14px;
    }
    input,textarea{
      width:100%;
      margin-top:12px;
      padding:13px;
      border-radius:13px;
      border:1px solid #333;
      background:#050505;
      color:white;
      outline:none;
      font-size:14px;
    }
    textarea{
      height:95px;
      resize:none;
    }
    button{
      width:100%;
      margin-top:12px;
      padding:14px;
      border:0;
      border-radius:13px;
      background:linear-gradient(135deg,#00ffb3,#00aaff);
      color:#000;
      font-weight:900;
      font-size:15px;
      cursor:pointer;
    }
    .status{
      margin-top:13px;
      text-align:center;
      color:#00ffb3;
      font-size:13px;
      word-break:break-word;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>FUN OWNER Push Admin</h2>
  <p>Free Worker se notification push karo.</p>

  <input id="adminSecret" type="password" placeholder="Admin secret/password">
  <input id="title" type="text" placeholder="Notification title" value="FUN OWNER">
  <textarea id="body" placeholder="Notification message">New update available!</textarea>
  <input id="link" type="text" placeholder="Click link" value="https://jahid9088.github.io/Notification-system/">
  <input id="icon" type="text" placeholder="Icon image URL optional">

  <button onclick="sendPush()">Send Push Notification</button>

  <div class="status" id="status">Status: Ready</div>
</div>

<script>
  const WORKER_URL = "PASTE_CLOUDFLARE_WORKER_URL_HERE";

  function setStatus(text){
    document.getElementById("status").innerText = "Status: " + text;
  }

  async function sendPush(){
    try{
      const adminSecret = document.getElementById("adminSecret").value.trim();
      const title = document.getElementById("title").value.trim();
      const body = document.getElementById("body").value.trim();
      const link = document.getElementById("link").value.trim();
      const icon = document.getElementById("icon").value.trim();

      if(!adminSecret){
        alert("Admin secret/password do.");
        return;
      }

      if(!title || !body){
        alert("Title aur message required hai.");
        return;
      }

      if(WORKER_URL === "PASTE_CLOUDFLARE_WORKER_URL_HERE"){
        alert("Pehle admin.html me WORKER_URL paste karo.");
        return;
      }

      setStatus("Sending push...");

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          adminSecret: adminSecret,
          title: title,
          body: body,
          link: link,
          icon: icon
        })
      });

      const data = await res.json();

      if(data.ok){
        setStatus(
          "Push sent ✅\n" +
          "Total tokens: " + data.totalTokens + "\n" +
          "Success: " + data.successCount + "\n" +
          "Failed: " + data.failureCount
        );
        alert("Notification sent!");
      }else{
        setStatus("Error ❌\n" + JSON.stringify(data, null, 2));
        alert(data.error || "Push failed");
      }

    }catch(e){
      console.error(e);
      setStatus("Error: " + e.message);
      alert(e.message);
    }
  }
</script>

</body>
</html>
